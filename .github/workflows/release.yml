name: Release

# Push a tag like v1.2.3 (matching "version" in package.json) to:
#   1. run the tests and build the .vsix with vsce
#   2. create a GitHub Release with the .vsix and the CHANGELOG notes
#   3. publish to the VS Code Marketplace   (only if the VSCE_PAT secret exists)
#   4. publish to Open VSX                  (only if the OVSX_PAT secret exists)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node test/run-tests.js

      - name: Check tag matches package.json version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      - name: Build VSIX
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out "xpp-language-tools-${GITHUB_REF_NAME#v}.vsix"

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Release $version" }
          $notes += "`n`n**Install:** download the ``.vsix`` below, then run ``code --install-extension xpp-language-tools-$version.vsix`` or use *Extensions → … → Install from VSIX…* in VS Code."
          Set-Content release-notes.md $notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xpp-language-tools-*.vsix --title "X++ Tools $GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath xpp-language-tools-*.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          npx --yes ovsx@0 create-namespace "$PUBLISHER" || echo "Namespace $PUBLISHER already exists"
          npx --yes ovsx@0 publish xpp-language-tools-*.vsix
